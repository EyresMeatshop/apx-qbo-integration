services:
  - type: web
    name: eyres-meat-chop-review
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Must match Intuit Developer → Redirect URIs exactly (same host as this web service).
      - key: QBO_REDIRECT_URI
        value: https://eyres-meat-chop-review.onrender.com/qbo-callback

  - type: worker
    name: eyres-meat-chop-live-sync
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python -u worker_loop.py
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SYNC_INTERVAL_SECONDS
        value: "60"
      - key: QBO_REDIRECT_URI
        value: https://eyres-meat-chop-review.onrender.com/qbo-callback

  - type: cron
    name: eyres-meat-chop-nightly
    runtime: python
    plan: starter
    # Run every minute; script self-gates to Tue–Sat 20:00 AST.
    schedule: "* * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -u scheduled_nightly.py
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: QBO_REDIRECT_URI
        value: https://eyres-meat-chop-review.onrender.com/qbo-callback
